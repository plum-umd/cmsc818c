name: Check teaching projects

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - allocator
          - queue
          - machine
          - compiler
          - protection
          - scheduler
          - risc-lookup
    steps:
      - uses: actions/checkout@v6
      - name: Build project and regression checks
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: projects/${{ matrix.project }}
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Report supplied theorem assumptions
        working-directory: projects/${{ matrix.project }}
        run: lake env lean Audit.lean
